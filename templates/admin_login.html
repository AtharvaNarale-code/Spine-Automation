<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin login – {{ company.name }}</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:linear-gradient(180deg,#fff,#e6eef9);color:#0e1a2b}
.box{width:100%;max-width:400px;background:#fff;border:1px solid #dfe6ef;border-radius:16px;padding:34px;box-shadow:0 14px 40px rgba(15,35,70,.12)}
.logo{width:48px;height:48px;border-radius:12px;background:#0a4d9c;display:grid;place-items:center;margin-bottom:16px}
h1{font-size:1.5rem;margin:0 0 4px}p{margin:0 0 22px;color:#5a6b82}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
input{width:100%;font:inherit;padding:12px 14px;border:1.5px solid #dfe6ef;border-radius:10px;margin-bottom:16px;background:#fbfcfe}
input:focus{outline:0;border-color:#0a4d9c;box-shadow:0 0 0 4px rgba(10,77,156,.12)}
button{width:100%;font:600 1rem Inter,sans-serif;padding:13px;border:0;border-radius:10px;background:#0a4d9c;color:#fff;cursor:pointer}
button:hover{background:#083c7a}
.flash{padding:12px 14px;border-radius:10px;margin-bottom:16px;background:#fdecec;border:1px solid #f3b6b6;color:#7f1d1d;font-weight:500;font-size:.93rem}
.back{display:block;text-align:center;margin-top:16px;font-size:.9rem;color:#5a6b82}
</style>
</head>
<body>
<form class="box" method="post">
  <div class="logo"><svg width="26" height="26" viewBox="0 0 64 64"><path d="M20 44c14 0 8-24 24-24" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round"/><circle cx="46" cy="44" r="5" fill="#f26a1b"/></svg></div>
  <h1>Admin login</h1>
  <p>{{ company.name }} website manager</p>
  {% with msgs = get_flashed_messages(with_categories=true) %}{% for cat, m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}{% endwith %}
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="u">Username</label><input id="u" name="username" autocomplete="username" autofocus required>
  <label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
  <a class="back" href="{{ url_for('home') }}">← Back to website</a>
</form>
</body>
</html>
